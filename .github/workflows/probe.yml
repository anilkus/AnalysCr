name: Probe keyless LLM
# spaced
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://text.pollinations.ai/openai
          p(){ echo "== $1"; curl -s -m 60 -w ' [%{http_code}]\n' -H 'content-type: application/json' -H 'Origin: https://anilkus.github.io' -d "$2" $U | head -c 200; echo; }
          p plain0 '{"model":"openai","messages":[{"role":"user","content":"2+2?"}]}'
          p plain1 '{"model":"openai","messages":[{"role":"user","content":"3+3?"}]}'
          sleep 20
          p plain '{"model":"openai","messages":[{"role":"system","content":"Kısa cevap ver."},{"role":"user","content":"2+2?"}]}'
          sleep 20
          p temp '{"model":"openai","temperature":0.3,"messages":[{"role":"user","content":"2+2?"}]}'
          sleep 20
          p json '{"model":"openai","response_format":{"type":"json_object"},"messages":[{"role":"user","content":"JSON dön: {\"a\":2+2}"}]}'
          L=$(python3 -c "print('x '*3000)")
          sleep 20
          p long3000 "{\"model\":\"openai\",\"messages\":[{\"role\":\"user\",\"content\":\"$L 2+2?\"}]}"
          L=$(python3 -c "print('x '*1000)")
          sleep 20
          p long1000 "{\"model\":\"openai\",\"messages\":[{\"role\":\"user\",\"content\":\"$L 2+2?\"}]}"
